<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Mantenedor de Fecha - Días sin Accidentes</title>
<style>
    body {
        font-family: system-ui, sans-serif;
        background: #111827;
        color: #e5e7eb;
        padding: 40px;
    }
    .panel {
        background: #1f2937;
        padding: 30px;
        border-radius: 12px;
        max-width: 500px;
        margin: auto;
        border: 1px solid #374151;
    }
    input[type="date"] {
        padding: 10px;
        font-size: 16px;
        width: 100%;
        margin-bottom: 20px;
        border-radius: 6px;
        border: 1px solid #4b5563;
        background: #111827;
        color: #e5e7eb;
    }
    button {
        padding: 12px 20px;
        font-size: 16px;
        background: #22c55e;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        width: 100%;
        font-weight: bold;
    }
    textarea {
        width: 100%;
        height: 150px;
        margin-top: 20px;
        padding: 10px;
        background: #0f172a;
        color: #22c55e;
        border: 1px solid #334155;
        border-radius: 6px;
        font-family: monospace;
        font-size: 14px;
    }
</style>
</head>
<body>

<div class="panel">
    <h2>Mantenedor de Fecha del Último Accidente</h2>

    <label>Selecciona la nueva fecha:</label>
    <input type="date" id="fecha">

    <button onclick="generarXML()">Generar XML</button>

    <textarea id="resultado" readonly></textarea>
</div>

<script>
function generarXML() {
    const fecha = document.getElementById("fecha").value;

    if (!fecha) {
        alert("Selecciona una fecha válida");
        return;
    }

    const xml = 
`<?xml version="1.0" encoding="UTF-8"?>
<estado>
    <fechaUltimoAccidente>${fecha}</fechaUltimoAccidente>
</estado>`;

    document.getElementById("resultado").value = xml;
}
</script>

</body>
</html>
