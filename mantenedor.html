<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Mantenedor — Días sin Accidentes</title>
<style>
    body { font-family: system-ui, sans-serif; background: #111827; color: #e5e7eb; padding: 40px; }
    .panel { background: #1f2937; padding: 30px; border-radius: 12px; max-width: 500px; margin: auto; border: 1px solid #374151; }
    input[type="date"] { padding: 10px; font-size: 16px; width: 100%; margin-bottom: 20px; border-radius: 6px; border: 1px solid #4b5563; background: #111827; color: #e5e7eb; }
    button { padding: 12px 20px; font-size: 16px; background: #22c55e; border: none; border-radius: 6px; cursor: pointer; width: 100%; font-weight: bold; }
    #msg { margin-top: 20px; font-weight: bold; }
</style>
</head>
<body>

<div class="panel">
    <h2>Mantenedor de Fecha del Último Accidente</h2>

    <label>Selecciona la nueva fecha:</label>
    <input type="date" id="fecha">

    <button onclick="guardar()">Guardar en GitHub</button>

    <div id="msg"></div>
</div>

<script>
const owner = "Alejomarchant";
const repo = "contador_dias_sin_accidente";
const path = "estado.xml";

async function guardar() {
    const fecha = document.getElementById("fecha").value;
    if (!fecha) {
        document.getElementById("msg").innerText = "Selecciona una fecha válida.";
        return;
    }

    // 🔐 Token ingresado solo en el navegador, nunca guardado
    const token = prompt("Ingresa tu token privado:");
    if (!token) {
        document.getElementById("msg").innerText = "No ingresaste token.";
        return;
    }

    const xml = `
<?xml version="1.0" encoding="UTF-8"?>
<estado>
    <fechaUltimoAccidente>${fecha}</fechaUltimoAccidente>
</estado>`.trim();

    const contenidoBase64 = btoa(unescape(encodeURIComponent(xml)));

    // 1. Obtener SHA del archivo actual
    const shaResponse = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/${path}`, {
        headers: { Authorization: `Bearer ${token}` }
    });

    const shaData = await shaResponse.json();
    const sha = shaData.sha;

    // 2. Subir archivo actualizado
    const updateResponse = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/${path}`, {
        method: "PUT",
        headers: {
            Authorization: `Bearer ${token}`,
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            message: "Actualización de fecha",
            content: contenidoBase64,
            sha: sha
        })
    });

    if (updateResponse.ok) {
        document.getElementById("msg").innerText = "Fecha actualizada correctamente.";
    } else {
        document.getElementById("msg").innerText = "Error al actualizar.";
    }
}
</script>

</body>
</html>
